<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1820" viewBox="0 0 1800 1820">
  <defs>
    <style>
      .h1 { font-family: "DejaVu Serif", serif; fill: #2f2a24; font-size: 40px; }
      .h2 { font-family: "DejaVu Serif", serif; fill: #2f2a24; font-size: 25px; }
      .s  { font-family: "DejaVu Sans", sans-serif; fill: #4a443c; font-size: 21px; }
      .sm { font-family: "DejaVu Sans", sans-serif; fill: #7d766a; font-size: 18px; }
      .key{ font-family: "DejaVu Sans", sans-serif; fill: #3f3931; font-size: 20px; }
      .keysm { font-family: "DejaVu Sans", sans-serif; fill: #8a8276; font-size: 17px; }
      .num{ font-family: "DejaVu Sans", sans-serif; font-size: 19px; font-weight: bold; }
    </style>
  </defs>

  <rect width="1800" height="1820" fill="#faf6ee"/>

  <text class="h1" x="60" y="62">The Memory Wall Hanging — simplified</text>
  <text class="s"  x="60" y="102">40″ × 50″  ·  ~40–60 hours  ·  $900–1,100  ·  10–14 weeks</text>
  <text class="sm" x="60" y="134">A working drawing, not a picture of a finished quilt. Agree this, then cut.</text>

  <!-- ================= QUILT  (25px = 1 inch, origin 350,190) ================= -->
  <rect x="350" y="190" width="1000" height="1250" fill="#2c313c"/>
  <rect x="425" y="265" width="850" height="1100" fill="#6d727b"/>

  <!-- shirt band across the top, 4in -->
  <rect x="425" y="265" width="850" height="100" fill="#84abd8"/>
  <g transform="translate(850,315) rotate(45)">
    <rect x="-33" y="-33" width="66" height="66" fill="#efe7d5" stroke="#d3c9b1" stroke-width="2"/>
  </g>

  <!--   centre medallion: the jacket front, kept whole (22 x 24in)   -->
  <rect x="575" y="365" width="550" height="600" fill="#2e3440"/>
  <polygon points="735,365 850,550 965,365" fill="#84abd8"/>
  <polygon points="735,365 850,450 965,365" fill="#9dbde2"/>
  <line x1="850" y1="450" x2="850" y2="550" stroke="#6f95c4" stroke-width="6"/>
  <circle cx="850" cy="492" r="6" fill="#f2ead9"/>
  <polygon points="670,365 735,365 850,550 790,605 670,450" fill="#3a4250"/>
  <polygon points="1030,365 965,365 850,550 910,605 1030,450" fill="#3a4250"/>
  <line x1="850" y1="550" x2="850" y2="965" stroke="#232833" stroke-width="3"/>
  <circle cx="850" cy="660" r="11" fill="#1b1f27"/>
  <circle cx="850" cy="752" r="11" fill="#1b1f27"/>
  <rect x="918" y="612" width="120" height="26" fill="#262c37"/>
  <rect x="628" y="812" width="165" height="46" fill="#262c37"/>
  <rect x="908" y="812" width="165" height="46" fill="#262c37"/>

  <!--   four half-square triangles (6in), flanking   -->
  <g stroke="#ffffff" stroke-opacity=".30" stroke-width="1.5">
    <rect x="427" y="415" width="150" height="150" fill="#84abd8"/>
    <polygon points="427,565 577,415 577,565" fill="#6d727b"/>
    <rect x="427" y="415" width="150" height="150" fill="none"/>

    <rect x="427" y="765" width="150" height="150" fill="#6d727b"/>
    <polygon points="427,765 577,765 427,915" fill="#84abd8"/>
    <rect x="427" y="765" width="150" height="150" fill="none"/>

    <rect x="1123" y="415" width="150" height="150" fill="#84abd8"/>
    <polygon points="1123,415 1273,415 1273,565" fill="#6d727b"/>
    <rect x="1123" y="415" width="150" height="150" fill="none"/>

    <rect x="1123" y="765" width="150" height="150" fill="#6d727b"/>
    <polygon points="1273,765 1123,915 1123,765" fill="#84abd8"/>
    <rect x="1123" y="765" width="150" height="150" fill="none"/>
  </g>

  <!--   bottom row: three 10in garment-feature blocks   -->
  <rect x="450" y="1015" width="250" height="250" fill="#84abd8"/>
  <path d="M505 1080 h140 v88 l-70 40 l-70 -40 z" fill="#93b7de" stroke="#6f95c4" stroke-width="3"/>
  <rect x="450" y="1015" width="250" height="250" fill="none" stroke="#2c313c" stroke-width="5"/>

  <rect x="725" y="1015" width="250" height="250" fill="#93b7de"/>
  <rect x="755" y="1092" width="190" height="96" rx="10" fill="#84abd8" stroke="#6f95c4" stroke-width="3"/>
  <circle cx="912" cy="1140" r="13" fill="#f2ead9" stroke="#cdc3ab" stroke-width="2"/>
  <rect x="725" y="1015" width="250" height="250" fill="none" stroke="#2c313c" stroke-width="5"/>

  <rect x="1000" y="1015" width="250" height="250" fill="#787d86"/>
  <rect x="1040" y="1118" width="170" height="30" fill="#5c616a"/>
  <line x1="1040" y1="1118" x2="1210" y2="1118" stroke="#4b5058" stroke-width="4"/>
  <rect x="1000" y="1015" width="250" height="250" fill="none" stroke="#2c313c" stroke-width="5"/>

  <!--   numbered callouts   -->
  <g>
    <g><circle cx="700" cy="700" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="700" y="707" text-anchor="middle" fill="#2f2a24">1</text></g>
    <g><circle cx="850" cy="520" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="850" y="527" text-anchor="middle" fill="#2f2a24">2</text></g>
    <g><circle cx="920" cy="248" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="920" y="255" text-anchor="middle" fill="#2f2a24">3</text></g>
    <g><circle cx="502" cy="490" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="502" y="497" text-anchor="middle" fill="#2f2a24">4</text></g>
    <g><circle cx="575" cy="1140" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="575" y="1147" text-anchor="middle" fill="#2f2a24">5</text></g>
    <g><circle cx="850" cy="1230" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="850" y="1237" text-anchor="middle" fill="#2f2a24">6</text></g>
    <g><circle cx="1125" cy="1230" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="1125" y="1237" text-anchor="middle" fill="#2f2a24">7</text></g>
    <g><circle cx="500" cy="660" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="500" y="667" text-anchor="middle" fill="#2f2a24">8</text></g>
    <g><circle cx="388" cy="1400" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="388" y="1407" text-anchor="middle" fill="#2f2a24">9</text></g>
  </g>

  <text class="sm" x="850" y="1490" text-anchor="middle">40″ wide · 50″ tall · 3″ border · low-loft batting · full-width hanging sleeve on the back</text>

  <!-- ================= KEY ================= -->
  <text class="h2" x="1400" y="238">The pieces</text>

  <g>
    <text class="key" x="1400" y="292">1 · Jacket front, kept whole</text>
    <text class="keysm" x="1400" y="317">lapels, buttons, both pockets</text>

    <text class="key" x="1400" y="372">2 · Shirt collar and placket</text>
    <text class="keysm" x="1400" y="397">set into the jacket neck</text>

    <text class="key" x="1400" y="452">3 · Cream pocket square</text>
    <text class="keysm" x="1400" y="477">the only cream there is</text>

    <text class="key" x="1400" y="532">4 · Half-square triangles ×4</text>
    <text class="keysm" x="1400" y="557">the ONLY piecing in the design</text>

    <text class="key" x="1400" y="612">5 · Shirt breast pocket</text>

    <text class="key" x="1400" y="672">6 · Shirt cuff, with his button</text>

    <text class="key" x="1400" y="732">7 · Trouser welt pocket</text>

    <text class="key" x="1400" y="792">8 · Trousers — background field</text>
    <text class="keysm" x="1400" y="817">the best yardage available</text>

    <text class="key" x="1400" y="872">9 · Border, 3″ — jacket cloth</text>
  </g>

  <g>
    <rect x="1400" y="940" width="340" height="2" fill="#ded6c6"/>
    <text class="key" x="1400" y="990">Nothing is bought in.</text>
    <text class="keysm" x="1400" y="1018">Every piece is his. That is the</text>
    <text class="keysm" x="1400" y="1042">whole difference from the</text>
    <text class="keysm" x="1400" y="1066">reference image.</text>

    <text class="key" x="1400" y="1130">Label on the back</text>
    <text class="keysm" x="1400" y="1158">whose clothes, and when.</text>
    <text class="keysm" x="1400" y="1182">The point of the object.</text>
  </g>

  <!-- ================= SWATCH LEGEND ================= -->
  <text class="h2" x="60" y="1570">Where the cloth comes from</text>
  <g>
    <rect x="60" y="1600" width="54" height="54" fill="#2e3440"/>
    <text class="key" x="130" y="1624">Boss jacket</text>
    <text class="keysm" x="130" y="1648">medallion + border</text>

    <rect x="480" y="1600" width="54" height="54" fill="#6d727b"/>
    <text class="key" x="550" y="1624">Trousers</text>
    <text class="keysm" x="550" y="1648">background field</text>

    <rect x="900" y="1600" width="54" height="54" fill="#84abd8"/>
    <text class="key" x="970" y="1624">Shirt</text>
    <text class="keysm" x="970" y="1648">collar, cuff, pocket, triangles</text>

    <rect x="1400" y="1600" width="54" height="54" fill="#efe7d5" stroke="#d3c9b1" stroke-width="2"/>
    <text class="key" x="1470" y="1624">Pocket square</text>
    <text class="keysm" x="1470" y="1648">one accent only</text>
  </g>

  <text class="sm" x="60" y="1740">Dragon Ink and Thread · San Antonio, Texas</text>
</svg>
