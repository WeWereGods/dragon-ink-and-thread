<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1820" viewBox="0 0 1800 1820">
  <defs>
    <style>
      .h1 { font-family: "DejaVu Serif", serif; fill: #2f2a24; font-size: 40px; }
      .h2 { font-family: "DejaVu Serif", serif; fill: #2f2a24; font-size: 25px; }
      .s  { font-family: "DejaVu Sans", sans-serif; fill: #4a443c; font-size: 21px; }
      .sm { font-family: "DejaVu Sans", sans-serif; fill: #7d766a; font-size: 18px; }
      .key{ font-family: "DejaVu Sans", sans-serif; fill: #3f3931; font-size: 20px; }
      .keysm { font-family: "DejaVu Sans", sans-serif; fill: #8a8276; font-size: 17px; }
      .num{ font-family: "DejaVu Sans", sans-serif; font-size: 19px; font-weight: bold; }
      .qline { stroke: #ffffff; stroke-opacity: .10; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1820" fill="#faf6ee"/>

  <text class="h1" x="60" y="62">The Memory Wall Hanging</text>
  <text class="s"  x="60" y="102">40″ × 50″  ·  ~40–60 hours  ·  $800  ·  materials supplied by you  ·  ready Jan–Feb 2027</text>
  <text class="sm" x="60" y="134">A working drawing, not a picture of a finished quilt. Agree this, then cut.</text>
  <text class="sm" x="60" y="162">Revised 19 Aug 2026 — new composition, and the price now excludes materials.</text>

  <!-- ================= QUILT  (25px = 1 inch, origin 350,190) ================= -->
  <!-- ground: jacket cloth, border and everything not otherwise covered -->
  <rect x="350" y="190" width="1000" height="1250" fill="#2c313c"/>
  <rect x="425" y="265" width="850" height="1100" fill="#2e3440"/>

  <!-- shoulder band: shirt, full width -->
  <rect x="425" y="420" width="850" height="150" fill="#84abd8"/>

  <!-- the two tapered fronts: trousers -->
  <polygon points="500,570 745,570 745,1365 660,1365" fill="#4a4f59"/>
  <polygon points="1200,570 955,570 955,1365 1040,1365" fill="#4a4f59"/>

  <!-- centre column: shirt, full height -->
  <rect x="745" y="265" width="210" height="1100" fill="#84abd8"/>

  <!-- cream pocket square at the shoulders -->
  <polygon points="580,265 745,265 745,420" fill="#efe7d5" stroke="#d3c9b1" stroke-width="2"/>
  <polygon points="1120,265 955,265 955,420" fill="#efe7d5" stroke="#d3c9b1" stroke-width="2"/>

  <!-- straight-line quilting, vertical, sparse -->
  <g class="qline">
    <line x1="480" y1="265" x2="480" y2="1365"/>
    <line x1="545" y1="265" x2="545" y2="1365"/>
    <line x1="610" y1="265" x2="610" y2="1365"/>
    <line x1="675" y1="265" x2="675" y2="1365"/>
    <line x1="800" y1="265" x2="800" y2="1365"/>
    <line x1="855" y1="265" x2="855" y2="1365"/>
    <line x1="905" y1="265" x2="905" y2="1365"/>
    <line x1="1025" y1="265" x2="1025" y2="1365"/>
    <line x1="1090" y1="265" x2="1090" y2="1365"/>
    <line x1="1155" y1="265" x2="1155" y2="1365"/>
    <line x1="1220" y1="265" x2="1220" y2="1365"/>
    <line x1="390" y1="190" x2="390" y2="1440"/>
    <line x1="1310" y1="190" x2="1310" y2="1440"/>
  </g>

  <!--   numbered callouts   -->
  <g>
    <g><circle cx="850" cy="900" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="850" y="907" text-anchor="middle" fill="#2f2a24">1</text></g>
    <g><circle cx="660" cy="330" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="660" y="337" text-anchor="middle" fill="#2f2a24">2</text></g>
    <g><circle cx="600" cy="900" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="600" y="907" text-anchor="middle" fill="#2f2a24">3</text></g>
    <g><circle cx="1180" cy="1150" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="1180" y="1157" text-anchor="middle" fill="#2f2a24">4</text></g>
    <g><circle cx="1100" cy="495" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="1100" y="502" text-anchor="middle" fill="#2f2a24">5</text></g>
    <g><circle cx="388" cy="1400" r="19" fill="#faf6ee" stroke="#2f2a24" stroke-width="2"/><text class="num" x="388" y="1407" text-anchor="middle" fill="#2f2a24">6</text></g>
  </g>

  <text class="sm" x="850" y="1490" text-anchor="middle">40″ wide · 50″ tall · 3″ border · low-loft batting · full-width hanging sleeve on the back</text>

  <!-- ================= KEY ================= -->
  <text class="h2" x="1400" y="238">The pieces</text>

  <g>
    <text class="key" x="1400" y="292">1 · Shirt — centre, full height</text>
    <text class="keysm" x="1400" y="317">cut on the straight grain</text>

    <text class="key" x="1400" y="372">2 · Cream pocket square</text>
    <text class="keysm" x="1400" y="397">at the shoulders — the only</text>
    <text class="keysm" x="1400" y="421">cream there is</text>

    <text class="key" x="1400" y="476">3 · Trousers — the two fronts</text>
    <text class="keysm" x="1400" y="501">cut as a mirrored pair</text>

    <text class="key" x="1400" y="556">4 · Jacket — the ground</text>

    <text class="key" x="1400" y="616">5 · Shirt — shoulder band</text>

    <text class="key" x="1400" y="676">6 · Border, 3″ — jacket cloth</text>
  </g>

  <g>
    <rect x="1400" y="740" width="340" height="2" fill="#ded6c6"/>
    <text class="key" x="1400" y="790">Nothing is bought in.</text>
    <text class="keysm" x="1400" y="818">Every piece is his. That is the</text>
    <text class="keysm" x="1400" y="842">whole difference from the</text>
    <text class="keysm" x="1400" y="866">reference image.</text>

    <text class="key" x="1400" y="930">Quilted in straight lines</text>
    <text class="keysm" x="1400" y="958">vertical and sparse, so it hangs</text>
    <text class="keysm" x="1400" y="982">flat rather than puffing.</text>

    <text class="key" x="1400" y="1046">Label on the back</text>
    <text class="keysm" x="1400" y="1074">whose clothes, and when.</text>
    <text class="keysm" x="1400" y="1098">The point of the object.</text>
  </g>

  <!-- ================= SWATCH LEGEND ================= -->
  <text class="h2" x="60" y="1570">Where the cloth comes from</text>
  <g>
    <rect x="60" y="1600" width="54" height="54" fill="#2e3440"/>
    <text class="key" x="130" y="1624">Boss jacket</text>
    <text class="keysm" x="130" y="1648">ground + border</text>

    <rect x="480" y="1600" width="54" height="54" fill="#4a4f59"/>
    <text class="key" x="550" y="1624">Trousers</text>
    <text class="keysm" x="550" y="1648">the two tapered fronts</text>

    <rect x="900" y="1600" width="54" height="54" fill="#84abd8"/>
    <text class="key" x="970" y="1624">Shirt</text>
    <text class="keysm" x="970" y="1648">centre column + shoulder band</text>

    <rect x="1400" y="1600" width="54" height="54" fill="#efe7d5" stroke="#d3c9b1" stroke-width="2"/>
    <text class="key" x="1470" y="1624">Pocket square</text>
    <text class="keysm" x="1470" y="1648">one accent only</text>
  </g>

  <text class="sm" x="60" y="1740">Dragon Ink and Thread · San Antonio, Texas</text>
</svg>
